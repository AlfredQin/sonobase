                img_folder: ${scratch.dataset_dir}/Brachial-Plexus/images
                gt_folder: ${scratch.dataset_dir}/Brachial-Plexus/gt
                file_list_txt: ${scratch.annotation_dir}/Brachial-Plexus/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
              training: true
              transforms: ${scratch.train_transforms}
              multiplier: 4
              video_dataset:
                _target_: nemo_cv.components.datasets.sam2.vos_raw_dataset.JSONRawDataset
                img_folder: ${scratch.dataset_dir}/CAMUS/images
                gt_folder: ${scratch.dataset_dir}/CAMUS/gt
                file_list_txt: ${scratch.annotation_dir}/CAMUS/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
              training: true
              transforms: ${scratch.train_transforms}
              multiplier: 4
              video_dataset:
                _target_: nemo_cv.components.datasets.sam2.vos_raw_dataset.JSONRawDataset
                img_folder: ${scratch.dataset_dir}/PFUS/images
                gt_folder: ${scratch.dataset_dir}/PFUS/gt
                file_list_txt: ${scratch.annotation_dir}/PFUS/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
