# 38 pretrain + 8 benchmark = 46 train datasets (11 video + 37 image)

train:
    _target_: nemo_cv.components.datasets.sam2.sam2_datasets.TorchTrainMixedDataset
    phases_per_epoch: 1
    batch_sizes:
      - ${scratch.train_video_batch_size}
      - ${scratch.train_image_batch_size}
    num_workers: ${scratch.num_train_workers}
    shuffle: true
    pin_memory: true
    drop_last: true
    collate_fn:
      _target_: nemo_cv.components.datasets.sam2.data_utils.collate_fn
      _partial_: true
      dict_key: all
    # Reseed numpy + Python random per DataLoader worker so augmentations
    # are deterministic given `seed`. torch RNG is already reseeded per
    # worker by PyTorch; np / random are not, and our transforms use both.
    worker_init_fn:
      _target_: nemo_cv.components.training.utils.seed_worker
      _partial_: true
    seed: ${scratch.seed}

    datasets:
      # ================================================================
      # Group 1: Video or volumetric datasets (batch_size=train_video_batch_size, num_frames=8)
      # ================================================================
      - _target_: nemo_cv.components.datasets.sam2.utils.RepeatFactorWrapper
        seed: ${scratch.seed}
        dataset:
          _target_: nemo_cv.components.datasets.sam2.utils.ConcatDataset
          datasets:
            # --- Pretrain video (8) ---
            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
              training: true
              # Cardiac apical-4-chamber: LV/RV anatomically fixed — hflip exchanges them.
              transforms: ${scratch.train_transforms_no_hflip}
              multiplier: 4
              video_dataset:
                _target_: nemo_cv.components.datasets.sam2.vos_raw_dataset.JSONRawDataset
                img_folder: ${scratch.dataset_dir}/EchoCP/images
                gt_folder: ${scratch.dataset_dir}/EchoCP/gt
                file_list_txt: ${scratch.annotation_dir}/EchoCP/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
              training: true
              transforms: ${scratch.train_transforms}
              multiplier: 4
              video_dataset:
                _target_: nemo_cv.components.datasets.sam2.vos_raw_dataset.JSONRawDataset
                img_folder: ${scratch.dataset_dir}/JNU-IFM/images
                gt_folder: ${scratch.dataset_dir}/JNU-IFM/gt
                file_list_txt: ${scratch.annotation_dir}/JNU-IFM/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
              training: true
              transforms: ${scratch.train_transforms}
              multiplier: 4
              video_dataset:
                _target_: nemo_cv.components.datasets.sam2.vos_raw_dataset.JSONRawDataset
                img_folder: ${scratch.dataset_dir}/MUP/images
                gt_folder: ${scratch.dataset_dir}/MUP/gt
                file_list_txt: ${scratch.annotation_dir}/MUP/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
              training: true
              # Right Ventricle Echo: laterality is the primary axis — hflip is anatomically wrong.
              transforms: ${scratch.train_transforms_no_hflip}
              multiplier: 4
              video_dataset:
                _target_: nemo_cv.components.datasets.sam2.vos_raw_dataset.JSONRawDataset
                img_folder: ${scratch.dataset_dir}/RVENet/images
                gt_folder: ${scratch.dataset_dir}/RVENet/gt
                file_list_txt: ${scratch.annotation_dir}/RVENet/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
              training: true
              transforms: ${scratch.train_transforms}
              multiplier: 4
              video_dataset:
                _target_: nemo_cv.components.datasets.sam2.vos_raw_dataset.JSONRawDataset
                img_folder: ${scratch.dataset_dir}/SegThy/images
                gt_folder: ${scratch.dataset_dir}/SegThy/gt
                file_list_txt: ${scratch.annotation_dir}/SegThy/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
              training: true
              # ABUS: scanner-fixed mediolateral/craniocaudal orientation — laterality is meaningful.
              transforms: ${scratch.train_transforms_no_hflip}
              multiplier: 4
              video_dataset:
                _target_: nemo_cv.components.datasets.sam2.vos_raw_dataset.JSONRawDataset
                img_folder: ${scratch.dataset_dir}/TDSC-ABUS/images
                gt_folder: ${scratch.dataset_dir}/TDSC-ABUS/gt
                file_list_txt: ${scratch.annotation_dir}/TDSC-ABUS/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
              training: true
              transforms: ${scratch.train_transforms}
              multiplier: 4
              video_dataset:
                _target_: nemo_cv.components.datasets.sam2.vos_raw_dataset.JSONRawDataset
                img_folder: ${scratch.dataset_dir}/ThyroidUSCineClip/images
                gt_folder: ${scratch.dataset_dir}/ThyroidUSCineClip/gt
                file_list_txt: ${scratch.annotation_dir}/ThyroidUSCineClip/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
              training: true
              transforms: ${scratch.train_transforms}
              multiplier: 4
              video_dataset:
                _target_: nemo_cv.components.datasets.sam2.vos_raw_dataset.JSONRawDataset
                img_folder: ${scratch.dataset_dir}/US-Nerve/images
                gt_folder: ${scratch.dataset_dir}/US-Nerve/gt
                file_list_txt: ${scratch.annotation_dir}/US-Nerve/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

            # --- Benchmark video (4) ---
            - _target_: nemo_cv.components.datasets.sam2.vos_dataset.VOSDataset
              training: true
              transforms: ${scratch.train_transforms}
              multiplier: 4
              video_dataset:
