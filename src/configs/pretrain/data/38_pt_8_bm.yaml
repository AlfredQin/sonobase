                file_list_txt: ${scratch.annotation_dir}/RegPro/train_list.txt
                ann_every: 1
              sampler: ${scratch.train_video_sampler}

      # ================================================================
      # Group 2: Image datasets (batch_size=image_batch_size, num_frames=1)
      # ================================================================
      - _target_: nemo_cv.components.datasets.sam2.utils.RepeatFactorWrapper
        seed: ${scratch.seed}
        dataset:
