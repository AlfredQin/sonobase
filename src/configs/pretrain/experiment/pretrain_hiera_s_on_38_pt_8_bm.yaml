# @package _global_
# SonoBase pretraining ablation — single Hiera-S encoder (SAM2-Small
# trunk) on the full 38 pretrain + 8 benchmark mixture. Smaller-capacity
# baseline for the encoder ablation series.
#
# Override scratch.ckpt_path to load the SAM2-Small release weights:
#   scratch.ckpt_path=${CHECKPOINT_DIR}/SAM2/sam2.1_hiera_small.pt
#
# Usage:
#   uv run torchrun --nproc_per_node=4 -m nemo_cv.recipes.sonobase.pretrain \
#     -c ./configs/pretrain \
#     experiment=pretrain_hiera_s_on_38_pt_8_bm \
#     scratch.ckpt_path=${CHECKPOINT_DIR}/SAM2/sam2.1_hiera_small.pt

defaults:
  - override /data: 38_pt_8_bm
  - override /model/image_encoder@model.image_encoder: hiera_s

scratch:
  experiment_name: sonobase/pretrain/38_pt_8_bm/hiera_s
