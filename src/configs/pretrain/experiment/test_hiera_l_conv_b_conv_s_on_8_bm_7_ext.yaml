# @package _global_
# Sonobase test experiment for variant `hiera_l_conv_b_conv_s` on the 8
# benchmark + 7 external test splits (15 datasets total). Mirrors
# test_hiera_b_conv_s_conv_t_on_8_bm_7_ext but selects the
# hiera_l_conv_b_conv_s image_encoder so the architecture matches the
# variant's pretraining DCP.

defaults:
  - override /data: 8_bm_7_ext
  - override /model/image_encoder@model.image_encoder: hiera_l_conv_b_conv_s

scratch:
  experiment_name: sonobase/test/8_bm_7_ext/hiera_l_conv_b_conv_s
  # branch0 init is redundant at eval (restore_from / the DCP supplies all
  # weights). The default scratch.ckpt_path is the 112-dim Hiera-B+ release
  # weight, which cannot load into this 144-dim Hiera-L trunk (size mismatch
  # raises even under strict=False). null skips the init load. NB: pretrain
  # instead overrides scratch.ckpt_path=.../sam2.1_hiera_large.pt on the CLI.
  ckpt_path: null

model:
  num_correction_pt_per_frame_val: 0  # 0 ~ 7, 0 = no correction
  prob_to_use_box_input_for_eval: 0   # 0 = point prompt, 1 = box prompt
