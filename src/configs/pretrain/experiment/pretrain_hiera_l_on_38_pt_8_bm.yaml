# @package _global_
# SonoBase pretraining ablation — single Hiera-L encoder (SAM2-Large
# trunk) on the full 38 pretrain + 8 benchmark mixture. Pairs with
# pretrain_hiera_l_conv_b_conv_s_on_38_pt_8_bm to isolate the multi-branch
# contribution at the larger encoder scale.
#
# Override scratch.ckpt_path to load the SAM2-Large release weights for
# the trunk init:
#   scratch.ckpt_path=${CHECKPOINT_DIR}/SAM2/sam2.1_hiera_large.pt
#
# Usage:
#   uv run torchrun --nproc_per_node=4 -m nemo_cv.recipes.sonobase.pretrain \
#     -c ./configs/pretrain \
#     experiment=pretrain_hiera_l_on_38_pt_8_bm \
#     scratch.ckpt_path=${CHECKPOINT_DIR}/SAM2/sam2.1_hiera_large.pt

defaults:
  - override /data: 38_pt_8_bm
  - override /model/image_encoder@model.image_encoder: hiera_l

scratch:
  experiment_name: sonobase/pretrain/38_pt_8_bm/hiera_l
