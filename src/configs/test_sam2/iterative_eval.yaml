# Top-level config for the B2 standalone iterative-correction sweep.
#
# Verification companion to the default B1 workflow (running `test.yaml` N
# times with different `scratch.num_correction_pt_per_frame_val` values).
# B2 caches the image-encoder output across iterations and is roughly
# len(iterations)x faster on dense inference; B1 stays the production
# default until B2 has been numerically validated against B1 on a small
# benchmark (see `scripts/benchmarks/test_sam2/iterative/`).
#
# Used by the recipe at `nemo_cv.recipes.benchmarks.iterative_eval`.
#
# Usage (CHECKPOINT_DIR must be set in env — e.g. `export CHECKPOINT_DIR=$WORK/Checkpoints`):
#   uv run torchrun --nproc-per-node=4 -m nemo_cv.recipes.benchmarks.iterative_eval \
#     -c ./configs/test_sam2 -cn iterative_eval \
#     experiment=test_sam2_no_ft_on_busi_camus \
#     ckpt_path=${CHECKPOINT_DIR}/SAM2/sam2.1_hiera_base_plus.pt
#
# Switch prompt type via the existing scratch knob, exactly as for B1:
#   scratch.prob_to_use_box_input_for_eval=0    # default: point prompts
#   scratch.prob_to_use_box_input_for_eval=1    # box prompts

defaults:
  - scratch: default
  - model@model: sam2
  - loss@loss_fn: sam2          # optional; provides per-dataset/per-iter test_loss
  - metric@_global_: sam2_vos
  - data: 8_bm_7_ext
  - experiment: null
  - _self_

recipe: nemo_cv.recipes.benchmarks.iterative_eval.IterativeEvalRecipe
seed: ${scratch.seed}
mode: test

# Sweep over these correction-click counts. Each entry maps to one
# `model.num_correction_pt_per_frame_val` value; the encoder is run once
# per batch and reused across all entries. Override on the CLI to expand
# / contract the sweep, e.g. `iterations=[0,1,2,3,5,7]`.
iterations: [0, 1, 3, 5, 7]

# REQUIRED override: path to a single `.pt` checkpoint file. Same format
# as for `test.yaml` (SAM2 / MedSAM2 release format, or sonobase
# pretraining checkpoint converted via `convert_sonobase_dcp_to_pt.py`).
ckpt_path: ???

# Force the encoder to run upfront on the whole flat image batch so that
# the cached features can be reused across iterations. Without this, B2
# would still re-run the encoder on-demand inside `forward_tracking`,
# defeating the entire point of the standalone path. The B2 recipe
# raises if this is left at the default `true`.
model:
  forward_backbone_per_frame_for_eval: false

dist_env:
  backend: nccl
  timeout_minutes: 10

distributed:
  find_unused_parameters: false

cuda:
  cudnn_deterministic: true
  cudnn_benchmark: false        # variable input sizes across datasets
  allow_tf32: false

optim:
  amp:
    enabled: true
    amp_dtype: bfloat16

# Test does not write checkpoints; we only reuse `save_dir` to know where
# to put the results/ directory. The B2 recipe writes
# `results/test_metrics_iterations.{json,csv}` (long-format) instead of
# the single-iteration `test_metrics.{json,csv}` produced by `test.yaml`.
checkpoint:
  enabled: false
  save_dir: ./experiments/${scratch.experiment_name}
  model_save_format: torch_save
  save_consolidated: false

logging:
  log_freq: 10
