# SAM2-Tiny Hiera trunk (used by medsam2 backbone — MedSAM2 is a
# medical fine-tune of SAM2-Tiny).
#
# Same `scalp: 0` + `fpn_top_down_levels: [0,1,2,3]` overrides as the
# `hiera_b+` variant — see that file for the rationale.
_target_: nemo_cv.components.models.sam2.modeling.backbones.image_encoder.ImageEncoder
scalp: 0
trunk:
  _target_: nemo_cv.components.models.sam2.modeling.backbones.hieradet.Hiera
  embed_dim: 96
  num_heads: 1
  stages: [1, 2, 7, 2]
  global_att_blocks: [5, 7, 9]
  window_pos_embed_bkg_spatial_size: [7, 7]
neck:
  _target_: nemo_cv.components.models.sam2.modeling.backbones.image_encoder.FpnNeck
  position_encoding:
    _target_: nemo_cv.components.models.sam2.modeling.position_encoding.PositionEmbeddingSine
    num_pos_feats: 256
    normalize: true
    scale: null
    temperature: 10000
  d_model: 256
  backbone_channel_list: [768, 384, 192, 96]
  fpn_top_down_levels: [0, 1, 2, 3]
  fpn_interp_model: nearest
