# C-TRUS — image dataset (transrectal US; single category `prostate`).
#
# Test split = canonical project list (97 samples) from the v2 deduplicated
# annotation dir, the same list the pretraining benchmark evaluates. Added for the evaluation-protocol
# unification: this dataset had no Stage-1 record, so its paper numbers
# came only from the pretraining harness.

name: C-TRUS
kind: image
saus_dir: ${scratch.dataset_dir}/C-TRUS
split_list_txt: ${scratch.annotation_dir}/C-TRUS/test_list.txt
image_ext: .jpg
gt_ext: .json
