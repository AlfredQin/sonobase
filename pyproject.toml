[project]
name = "sonobase"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fvcore>=0.1.5.post20221221",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "nemo-automodel",
    "omegaconf>=2.3.0",
    "openpyxl>=3.1.5",
    "pycocotools>=2.0.11",
    "scikit-image>=0.26.0",
    "simpleitk>=2.5.4",
    "statsmodels>=0.14.6",
    "timm>=1.0.26",
    "torchmetrics>=1.9.0",
    "wandb>=0.26.0",
